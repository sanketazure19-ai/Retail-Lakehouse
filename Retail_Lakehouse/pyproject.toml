[project]
name = "Retail_Lakehouse"
version = "0.0.1"
authors = [{ name = "sanketazure19@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120