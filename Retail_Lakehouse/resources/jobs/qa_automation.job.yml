resources:
  jobs:
    qa_automation:
      name: "[${bundle.target}] Retail Lakehouse - QA Automation"
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - ../../dist/*.whl
      tasks:
        - task_key: qa_validation
          notebook_task:
            notebook_path: ../../src/notebooks/06_qa_automation.py
            base_parameters:
              environment: ${bundle.target}
          environment_key: default
