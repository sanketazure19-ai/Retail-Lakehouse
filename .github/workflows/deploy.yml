name: Retail Lakehouse CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: Retail_Lakehouse

concurrency:
  group: retail-lakehouse-deployment
  cancel-in-progress: false

jobs:

  # ============================================================
  # DEV
  # ============================================================
  deploy_dev:
    name: Deploy DEV
    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Compile Python
        run: |
          python -m compileall src

      - name: Check Git whitespace
        run: |
          git diff --check

      - name: Build wheel
        run: |
          python -m build

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks authentication
        run: |
          test -n "$DATABRICKS_HOST"
          test -n "$DATABRICKS_CLIENT_ID"
          test -n "$DATABRICKS_CLIENT_SECRET"
          echo "Databricks authentication variables are configured"

      - name: Validate DEV bundle
        run: |
          databricks bundle validate --target dev

      - name: Deploy DEV
        run: |
          databricks bundle deploy --target dev

      - name: DEV deployment summary
        run: |
          echo "DEV deployment completed"
          echo "Commit: $GITHUB_SHA"


  # ============================================================
  # STAGING
  # ============================================================
  deploy_staging:
    name: Deploy STAGING
    runs-on: ubuntu-latest
    needs: deploy_dev
    environment: staging

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Compile Python
        run: |
          python -m compileall src

      - name: Check Git whitespace
        run: |
          git diff --check

      - name: Build wheel
        run: |
          python -m build

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks authentication
        run: |
          test -n "$DATABRICKS_HOST"
          test -n "$DATABRICKS_CLIENT_ID"
          test -n "$DATABRICKS_CLIENT_SECRET"
          echo "Databricks authentication variables are configured"

      - name: Validate STAGING bundle
        run: |
          databricks bundle validate --target staging

      - name: Deploy STAGING
        run: |
          databricks bundle deploy --target staging

      - name: STAGING deployment summary
        run: |
          echo "STAGING deployment completed"
          echo "Commit: $GITHUB_SHA"


  # ============================================================
  # PROD
  # ============================================================
  deploy_prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    needs: deploy_staging
    environment: prod

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Compile Python
        run: |
          python -m compileall src

      - name: Check Git whitespace
        run: |
          git diff --check

      - name: Build wheel
        run: |
          python -m build

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks authentication
        run: |
          test -n "$DATABRICKS_HOST"
          test -n "$DATABRICKS_CLIENT_ID"
          test -n "$DATABRICKS_CLIENT_SECRET"
          echo "Databricks authentication variables are configured"

      - name: Validate PROD bundle
        run: |
          databricks bundle validate --target prod

      - name: Deploy PROD
        run: |
          databricks bundle deploy --target prod

      - name: PROD deployment summary
        run: |
          echo "PROD deployment completed"
          echo "Commit: $GITHUB_SHA"
